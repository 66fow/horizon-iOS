name: Sync Upstream Force

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: sync-upstream
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch upstream

      - name: Merge and Protect packaging/ios
        run: |
          # 1. Start the merge but pause before committing (--no-commit)
          # The '|| true' ensures the script continues even if tree conflicts occur
          git merge upstream/main -X theirs --allow-unrelated-histories --no-commit || true

          # 2. Check if a merge is actually in progress
          if [ -f .git/MERGE_HEAD ]; then
            echo "Merge in progress. Protecting packaging/ios/ directory..."
            
            # Wipe the directory from staging and working tree to clear any upstream changes
            git rm -rfq packaging/ios/ 2>/dev/null || true
            
            # Restore the directory exactly as it is in our local HEAD
            git checkout HEAD -- packaging/ios/ 2>/dev/null || true
            
            # 3. Finalize the merge
            git commit -m "chore: force sync with upstream (protected packaging/ios)"
          else
            echo "Repository is already up to date."
          fi
          
      - name: Push merged results
        run: |
          git push origin sync-upstream
