# Builds Horizon Mods (packaging/ios/builder/), the iPhone app that picks native mods and starts
# "iOS build with native mods" runs, and publishes it as a pre-release tagged ios-mods-r<N>.
name: iOS Horizon Mods app

on:
  workflow_dispatch:
  push:
    branches: [ios-build]
    paths:
      - packaging/ios/builder/**
      - .github/workflows/ios-mods-app.yml

permissions:
  contents: write

concurrency:
  group: ios-mods-app
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/ios/builder/signer
          key: horizon-mods-signer
      - name: The signer on a real Horizon build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest Horizon .ipa's program, and a throwaway certificate shaped like an Apple
          # Development one (the iPhone's own check of the signature can only happen on an iPhone).
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '[.[]|select(.tag_name|test("^ios-r[0-9]+$"))][0].tag_name')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP"/ipa/*.ipa 'Payload/*.app/horizon-client' -d "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 30 \
            -subj "/CN=Apple Development: Horizon Test (ABCDE12345)/OU=ABCDE12345/O=Horizon Test/C=US"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out test.p12 -passout pass:horizon
          cd "$GITHUB_WORKSPACE/packaging/ios/builder/signer"
          HORIZON_TEST_PROGRAM=$(ls "$RUNNER_TEMP"/ipa/Payload/*.app/horizon-client) \
          HORIZON_TEST_P12="$RUNNER_TEMP/test.p12" HORIZON_TEST_P12_PASSWORD=horizon \
            cargo test --release --locked -- --nocapture
      - name: Build
        run: |
          chmod +x packaging/ios/builder/package.sh
          packaging/ios/builder/package.sh "1.0.$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" dist
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonMods-ios
          path: dist/HorizonMods.ipa
          if-no-files-found: error
      - name: Publish the release
        if: github.ref == 'refs/heads/ios-build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="dist/HorizonMods-1.0.$GITHUB_RUN_NUMBER.ipa"
          cp dist/HorizonMods.ipa "$file"
          gh release create "ios-mods-r$GITHUB_RUN_NUMBER" "$file" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Horizon Mods $GITHUB_RUN_NUMBER (iPhone app)" \
            --notes "Pick native mods on your iPhone and have GitHub build Horizon with them. Sideload this .ipa like Horizon's (packaging/ios/native-mods.md)."
