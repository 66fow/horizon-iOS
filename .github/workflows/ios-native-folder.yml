# Builds Horizon for iOS with the native mods in the `mod-list/` folder of the ios-build branch.
# Put one `<id>.hnmod` per mod there (a zip with the `mixins/` folder, optionally horizon-native.json),
# or a plain folder `mod-list/<id>/mixins/<id>/horizon-mixin.toml`. Then run
# Actions -> "iOS build with mods from mod-list folder". Same staging and iOS build as
# ios-native-build.yml, but the mods come from the repo, not from the registry.
name: iOS build with mods from mod-list folder

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-folder
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      mods: ${{ steps.collect.outputs.mods }}
      package: ${{ steps.stage.outputs.package }}
      features: ${{ steps.stage.outputs.features }}
      mods_ok: ${{ steps.stage.outputs.mods_ok }}
      skipped: ${{ steps.stage.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-upstream
          path: horizon
          persist-credentials: false

      - name: Collect the mods from mod-list/
        id: collect
        run: |
          set -euo pipefail
          src="$PWD/horizon/mod-list"
          [ -d "$src" ] || { echo "::error::the folder mod-list/ is not on the ios-build branch"; exit 1; }
          revision=$(git -C horizon rev-parse HEAD)
          mixins=$(git ls-remote https://github.com/horizon-rust/horizon-mixins HEAD | cut -f1)
          mkdir -p mods
          ids=""

          # Checks mods/<id>; writes horizon-native.json only when the mod has none.
          finish() {
            local id="$1" dir="mods/$1"
            find "$dir/mixins" -name horizon-mixin.toml 2>/dev/null | grep -q . || {
              echo "::error::$id: no mixins/<name>/horizon-mixin.toml in it. What the mod holds:"
              (cd "$dir" && find . -type f | head -40)
              exit 1
            }
            if [ ! -f "$dir/horizon-native.json" ]; then
              local toml version
              toml=$(find "$dir/mixins" -name horizon-mixin.toml | head -1)
              version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$toml" | head -1)
              [[ "$version" =~ ^[0-9A-Za-z.+-]{1,32}$ ]] || { echo "::error::$id: version \"$version\" is not a plain version like 0.1.0"; exit 1; }
              ID="$id" V="$version" R="$revision" M="$mixins" python3 -c 'import json,os; print(json.dumps({"schema": 1, "id": os.environ["ID"], "version": os.environ["V"], "game": "26.3", "horizon": os.environ["R"], "mixins": os.environ["M"]}, indent=1))' > "$dir/horizon-native.json"
            fi
            local shown
            shown=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("version","?"), "hooks=" + str(d.get("hooks","-")))' "$dir/horizon-native.json")
            ids="$ids $id"
            echo "Mod $id $shown"
          }

          shopt -s nullglob
          # 1) .hnmod files: the file name can be anything (connected_textures-0.1.5.hnmod);
          #    the id is read from the mod itself.
          for f in "$src"/*.hnmod; do
            tmp=$(mktemp -d)
            unzip -q "$f" -d "$tmp" || { echo "::error::$(basename "$f") is not a zip"; exit 1; }
            if [ -f "$tmp/horizon-native.json" ]; then
              id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$tmp/horizon-native.json")
            else
              id=$(ls "$tmp/mixins" 2>/dev/null | head -1)
            fi
            [[ "$id" =~ ^[a-z0-9_]{1,64}$ ]] || {
              echo "::error::$(basename "$f"): cannot find the mod id (got \"$id\"). What the file holds:"
              (cd "$tmp" && find . -type f | head -30)
              exit 1
            }
            [ ! -e "mods/$id" ] || { echo "::error::mod $id is in mod-list/ twice (see $(basename "$f")): keep one version"; exit 1; }
            mkdir -p "mods/$id"
            cp -R "$tmp"/. "mods/$id"/
            rm -rf "$tmp"
            finish "$id"
          done
          # 2) plain folders mod-list/<id>/mixins/<id>/...
          for d in "$src"/*/; do
            id=$(basename "$d")
            [ -d "$d/mixins" ] || continue
            [[ "$id" =~ ^[a-z0-9_]{1,64}$ ]] || { echo "::error::folder $id: the name must be the mod id ([a-z0-9_], 64 at most)"; exit 1; }
            [ ! -e "mods/$id" ] || { echo "::error::$id is there twice (a .hnmod and a folder)"; exit 1; }
            mkdir -p "mods/$id"
            cp -R "$d/mixins" "mods/$id/"
            finish "$id"
          done

          if find mods -type l | grep -q .; then echo "::error::a mod has links in it"; exit 1; fi
          if [ -z "${ids// /}" ]; then echo "::error::no mods in mod-list/ (add <id>.hnmod files)"; exit 1; fi
          echo "mods=${ids# }" >> "$GITHUB_OUTPUT"
          # The folder is not part of the game's source.
          rm -rf horizon/mod-list

      - name: Linux libraries the launcher links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon/launcher
          key: native-stage
      - name: Build the launcher's command line
        run: cargo build --release --manifest-path horizon/launcher/Cargo.toml --bin horizon-launcher

      - name: Stage the mods onto Horizon's source
        id: stage
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}/launcher-home
          HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"
        run: |
          revision=$(git -C horizon rev-parse HEAD)
          echo "$revision" > horizon/.horizon-revision
          find horizon -type l -print -delete
          rm -rf horizon/.git
          # Each mod is tried alone first: one that does not apply to this branch's source is
          # skipped (and named in the log and the release notes) instead of failing the whole build.
          ok=""; skipped=""
          for d in mods/*/; do
            id=$(basename "$d")
            rm -rf probe-mods probe-out
            mkdir probe-mods
            cp -R "$d" "probe-mods/$id"
            if horizon/launcher/target/release/horizon-launcher native-stage "$PWD/probe-mods" \
              --source "$PWD/horizon" --revision "$revision" --out "$PWD/probe-out" --rust "$HOME/.cargo" \
              --trust-native-code > probe.json 2> probe.err; then
              ok="$ok $id"
              echo "OK      $id"
            else
              skipped="$skipped $id"
              echo "::warning::SKIPPED $id: it does not apply to this branch's source"
              jq -r '"    \(.code) - \(.message) (\(.target // ""))"' probe.json 2>/dev/null \
                || { head -c 600 probe.json; tail -n 8 probe.err; }
              rm -rf "mods/$id"
            fi
          done
          rm -rf probe-mods probe-out
          echo "mods_ok=${ok# }" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped# }" >> "$GITHUB_OUTPUT"
          if [ -z "${ok// /}" ]; then echo "::error::none of the mods applies to this branch's source"; exit 1; fi

          if ! horizon/launcher/target/release/horizon-launcher native-stage "$PWD/mods" \
            --source "$PWD/horizon" --revision "$revision" --out "$PWD/staged" --rust "$HOME/.cargo" \
            --trust-native-code > staged.json; then
            cat staged.json
            echo "::error::a mod does not apply to this branch's source"
            tail -n 120 "$HORIZON_LAUNCHER_HOME/native/build.log" || true
            exit 1
          fi
          cat staged.json
          package=$(python3 -c 'import json;print(json.load(open("staged.json"))["package"])')
          features=$(python3 -c 'import json;print("--features horizon-client/mods" if json.load(open("staged.json"))["mods_feature"] else "")')
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "features=$features" >> "$GITHUB_OUTPUT"
          tar --exclude=./target --exclude=./.git --exclude=./launcher/target -czf staged.tar.gz -C staged .
          ls -lh staged.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: staged-folder
          path: |
            staged.tar.gz
            staged.json
          retention-days: 3

  ipa:
    needs: stage
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-upstream
          path: horizon
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staged-folder
      - name: Unpack the staged source
        run: mkdir ws && tar -xzf staged.tar.gz -C ws
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ws
          key: ios-native
      - name: Build
        working-directory: ws
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          HORIZON_IOS_REPO: ${{ github.repository }}
        run: >-
          cargo build --profile fast --target aarch64-apple-ios
          -p ${{ needs.stage.outputs.package }} --bin horizon-client ${{ needs.stage.outputs.features }}
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' horizon/crates/horizon-client/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          horizon/packaging/ios/package.sh ws/target/aarch64-apple-ios/fast/horizon-client "$version" dist
          
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ios-folder-mods
          path: dist/Horizon.ipa
          if-no-files-found: error
          
