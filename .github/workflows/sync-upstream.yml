name: Sync Upstream (Safe Mode)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: sync-upstream
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch upstream

      - name: Attempt Merge (Abort & Warn on conflict)
        run: |
          # Attempt a normal merge. If conflicts occur, the script enters the 'if' condition
          if ! git merge upstream/main -m "chore: sync with upstream horizon-rust/horizon"; then
            # Display a custom warning message in GitHub Actions
            echo "::error title=Conflict Detected!::Your custom files (e.g., touch screen controls) conflict with upstream updates. Auto-merge aborted."
            # Abort the merge process to keep the repository clean
            git merge --abort
            # Stop the workflow with a 'Failed' status
            exit 1
          fi

      - name: Push merge results (Only if safe)
        run: |
          git push origin sync-upstream
