[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
winit = "0.30.13"
png = "0.18"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
# The window icon test decodes Horizon's icon.
horizon-theme = { path = "../horizon-theme" }

# The system clipboard; iOS has no arboard backend (clipboard.rs keeps text in the game).
[target.'cfg(not(target_os = "ios"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[features]
controllers = []

[lints]
workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
# The system clipboard: UIKit's pasteboard (clipboard.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
